# values-ha-test.yaml — minimal overlay for verifying the HA fork's
# router cluster on a local docker-desktop k8s. Brings up ONLY the
# cubestore router StatefulSet (no api, no workers, no refresh-worker)
# so the test focuses on the M4 / M5 / M6 / M7 wiring.
#
# Apply with:
#   helm upgrade --install cube-ha charts/cube-stack-ha \
#     -f charts/cube-stack-ha/values.yaml \
#     -f charts/cube-stack-ha/values-ha-test.yaml \
#     -n cube-ha --create-namespace --wait
#
# Pre-flight on docker-desktop k8s:
#   - Allocate ≥ 64 GiB to the Docker Desktop VM disk
#     (Settings → Resources → Disk image size). The default 47 GiB
#     can hit kubelet's disk-pressure threshold under modest churn,
#     and once kubelet sets DiskPressure=True it evicts pods
#     immediately — even with tolerations.
#   - Verify `kubectl describe node docker-desktop | grep
#     DiskPressure` shows `False` before `make ha-deploy`.
#   - The hostpath StorageClass on docker-desktop's storage-
#     provisioner is fine; for richer storage classes (NFS, CSI,
#     etc.) override `cubestore.router.persistence.storageClass`.

quickstart:
  enabled: true  # bypasses datasource validation; we don't run queries

# Use the locally-built fork image. `make ha-image` produces
# `cubestore-ha:vdev`. The chart's `cubeStack.cubestoreImage` helper
# auto-prepends `v` to non-v tags, so writing `tag: vdev` keeps the
# rendered image name aligned with what `docker build` produces.
cubestoreImage:
  repository: cubestore-ha
  tag: vdev
  pullPolicy: IfNotPresent

# Skip everything except the cubestore router. The api, schema source,
# and refresh-worker components aren't relevant for verifying the raft
# cluster forms.
api:
  enabled: false
refreshWorker:
  enabled: false

metrics:
  # Cubestore emits metrics via statsd; the sidecar converts to a
  # Prometheus-style /metrics endpoint on port 9102. The HA verifier
  # scrapes the sidecar to read cs_raft_* gauges.
  statsdExporter:
    enabled: true

cubestore:
  enabled: true
  logLevel: debug   # makes raft transport's send/recv visible
  ha:
    enabled: true
    raftPort: 9100
    dashboard:
      enabled: false  # Grafana isn't deployed in this test harness

  # docker-desktop / kind has a single node, so soft-spread.
  # On real prod use the chart default (type: required).
  antiAffinity:
    enabled: true
    type: preferred

  # 3 router replicas for raft quorum. Storage on the default
  # docker-desktop StorageClass (hostpath).
  router:
    replicas: 3
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path  # rancher local-path-provisioner
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  # No workers in this test; raft is purely about the routers.
  workers:
    replicas: 0

  # Use the in-cluster minio (deployed by `make ha-deploy` precondition)
  # as the remote-storage backend. This avoids the RWX requirement that
  # `shared-pvc` mode imposes — local-path-provisioner only supports
  # ReadWriteOnce. The minio Service `minio.cube-ha.svc:9000` is brought
  # up by hand before the helm install (see scripts/ha-verify.sh and
  # the operational note at the top of this file).
  remoteStorage:
    type: minio
    minio:
      bucket: cubestore
      endpoint: http://minio.cube-ha.svc:9000
      region: us-east-1
      accessKey: minioadmin
      secretKey: minioadmin
