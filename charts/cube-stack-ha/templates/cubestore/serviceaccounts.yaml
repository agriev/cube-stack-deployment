{{- if and .Values.cubestore.enabled .Values.cubestore.router.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cubeStack.cubestore.router.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.componentLabels" (dict "ctx" . "component" "cubestore-router") | nindent 4 }}
{{- end }}
{{- if and .Values.cubestore.enabled .Values.cubestore.workers.serviceAccount.create (gt (.Values.cubestore.workers.replicas | int) 0) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cubeStack.cubestore.workers.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.componentLabels" (dict "ctx" . "component" "cubestore-workers") | nindent 4 }}
{{- end }}
