{{- if and .Values.tests.enabled .Values.cubestore.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cubeStack.fullname" . }}-test-cubestore
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext: {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "→ Cube Store router /readyz"
          curl -fsS "http://{{ include "cubeStack.cubestore.router.fullname" . }}:{{ .Values.cubestore.statusPort }}/readyz"
          echo
          echo "OK"
{{- end }}
