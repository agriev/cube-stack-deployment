{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubeStack.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- include "cubeStack.maybeAnnotations" . | nindent 2 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels: {{- include "cubeStack.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cubeStack.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include (print .Template.BasePath "/common/secrets.yaml") . | sha256sum }}
        {{- if .Values.schema.configMap.enabled }}
        checksum/schema: {{ include (print .Template.BasePath "/common/schema-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cubeStack.api.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- $initFromSchema := include "cubeStack.schema.initContainers" . }}
      {{- if or $initFromSchema .Values.api.initContainers }}
      initContainers:
        {{- if $initFromSchema }}{{ $initFromSchema | nindent 8 }}{{- end }}
        {{- with .Values.api.initContainers }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- end }}
      containers:
        - name: cube
          image: {{ include "cubeStack.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.cube.apiPort }}
              protocol: TCP
            {{- if gt (.Values.cube.pgSqlPort | int) 0 }}
            - name: pgsql
              containerPort: {{ .Values.cube.pgSqlPort }}
              protocol: TCP
            {{- end }}
            {{- if gt (.Values.cube.sqlPort | int) 0 }}
            - name: sql
              containerPort: {{ .Values.cube.sqlPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "cubeStack.cubeEnv" . | nindent 12 }}
            {{- with .Values.cube.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
            {{- with .Values.api.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          {{- $envFrom := concat (default (list) .Values.cube.extraEnvFrom) (default (list) .Values.api.extraEnvFrom) }}
          {{- if $envFrom }}
          envFrom:
            {{- toYaml $envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.api.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.api.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "cubeStack.schema.volumeMounts" . | nindent 12 }}
            {{- with .Values.api.extraVolumeMounts }}{{- toYaml . | nindent 12 }}{{- end }}
        {{- with .Values.api.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "cubeStack.schema.volumes" . | nindent 8 }}
        {{- with .Values.api.extraVolumes }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tsc := include "cubeStack.topologySpread" (dict "ctx" . "component" "api" "user" .Values.api.topologySpreadConstraints) }}
      {{- if trim $tsc }}
      topologySpreadConstraints:
        {{- $tsc | nindent 8 }}
      {{- end }}
{{- end }}
