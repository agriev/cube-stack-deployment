{{- if .Values.networkPolicy.enabled }}
# Allow traffic between cube-stack components and from configured callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-internal" (include "cubeStack.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cubeStack.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if not .Values.networkPolicy.allowAllEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "cubeStack.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.apiAllowFrom }}
    - from:
{{ toYaml . | indent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.cube.apiPort }}
        {{- if gt ($.Values.cube.pgSqlPort | int) 0 }}
        - protocol: TCP
          port: {{ $.Values.cube.pgSqlPort }}
        {{- end }}
        {{- if gt ($.Values.cube.sqlPort | int) 0 }}
        - protocol: TCP
          port: {{ $.Values.cube.sqlPort }}
        {{- end }}
    {{- end }}
  {{- if not .Values.networkPolicy.allowAllEgress }}
  # PR-O2: workable lockdown mode. See the vanilla chart's matching
  # template for a longer explanation. Bakes in DNS + intra-namespace
  # cube traffic; everything else (datasource, S3 / MinIO, external
  # APIs) goes into `networkPolicy.extraEgress`.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels: {{- include "cubeStack.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
