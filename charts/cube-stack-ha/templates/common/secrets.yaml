{{- /*
Aggregate secret with all chart-managed credentials. External secrets
(apiSecretFromSecret, datasources[*].existingSecret, etc.) are NOT mirrored
here; only inline values land in this object.
*/ -}}
{{- $needSecret := false -}}
{{- if and (not .Values.cube.apiSecretFromSecret.name) -}}{{- $needSecret = true -}}{{- end -}}
{{- if and (not .Values.cube.sqlAuth.existingSecret) .Values.cube.sqlAuth.user -}}{{- $needSecret = true -}}{{- end -}}
{{- range $name, $ds := .Values.datasources -}}
{{- if and (not $ds.existingSecret) $ds.password -}}{{- $needSecret = true -}}{{- end -}}
{{- if and $ds.export $ds.export.aws (not $ds.export.aws.existingSecret) $ds.export.aws.key -}}{{- $needSecret = true -}}{{- end -}}
{{- end -}}
{{- with .Values.cubestore.remoteStorage -}}
{{- if and (eq .type "s3") (not .s3.existingSecret) .s3.accessKey -}}{{- $needSecret = true -}}{{- end -}}
{{- if and (eq .type "gcs") (not .gcs.existingSecret) .gcs.credentials -}}{{- $needSecret = true -}}{{- end -}}
{{- if and (eq .type "minio") (not .minio.existingSecret) .minio.accessKey -}}{{- $needSecret = true -}}{{- end -}}
{{- end -}}
{{- if $needSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cubeStack.secrets.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.labels" . | nindent 4 }}
  {{- include "cubeStack.maybeAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- if not .Values.cube.apiSecretFromSecret.name }}
  cube-api-secret: {{ default (randAlphaNum 64) .Values.cube.apiSecret | quote }}
  {{- end }}
  {{- if and (not .Values.cube.sqlAuth.existingSecret) .Values.cube.sqlAuth.user }}
  cube-sql-user: {{ .Values.cube.sqlAuth.user | quote }}
  cube-sql-password: {{ default (randAlphaNum 32) .Values.cube.sqlAuth.password | quote }}
  {{- end }}
  {{- range $name, $ds := .Values.datasources }}
  {{- if and (not $ds.existingSecret) $ds.password }}
  {{ printf "ds-%s-password" $name }}: {{ $ds.password | quote }}
  {{- end }}
  {{- if and $ds.export $ds.export.aws (not $ds.export.aws.existingSecret) $ds.export.aws.key }}
  {{ printf "ds-%s-export-aws-key" $name }}: {{ $ds.export.aws.key | quote }}
  {{ printf "ds-%s-export-aws-secret" $name }}: {{ $ds.export.aws.secret | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.cubestore.remoteStorage }}
  {{- if and (eq .type "s3") (not .s3.existingSecret) .s3.accessKey }}
  cubestore-s3-access-key: {{ .s3.accessKey | quote }}
  cubestore-s3-secret-key: {{ .s3.secretKey | quote }}
  {{- end }}
  {{- if and (eq .type "gcs") (not .gcs.existingSecret) .gcs.credentials }}
  cubestore-gcs-credentials: {{ .gcs.credentials | quote }}
  {{- end }}
  {{- if and (eq .type "minio") (not .minio.existingSecret) .minio.accessKey }}
  cubestore-minio-access-key: {{ .minio.accessKey | quote }}
  cubestore-minio-secret-key: {{ .minio.secretKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
