{{- if and .Values.refreshWorker.enabled .Values.refreshWorker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cubeStack.refreshWorker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.componentLabels" (dict "ctx" . "component" "refresh-worker") | nindent 4 }}
  {{- include "cubeStack.maybeAnnotations" . | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cubeStack.refreshWorker.fullname" . }}
  minReplicas: {{ .Values.refreshWorker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.refreshWorker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.refreshWorker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.refreshWorker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.refreshWorker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.refreshWorker.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
