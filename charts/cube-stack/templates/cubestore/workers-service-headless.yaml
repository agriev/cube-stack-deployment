{{- if and .Values.cubestore.enabled (gt (.Values.cubestore.workers.replicas | int) 0) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubeStack.cubestore.workers.headless" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cubeStack.componentLabels" (dict "ctx" . "component" "cubestore-workers") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "cubeStack.componentSelectorLabels" (dict "ctx" . "component" "cubestore-workers") | nindent 4 }}
  ports:
    - name: worker
      port: {{ .Values.cubestore.workerPort }}
      targetPort: worker
      protocol: TCP
{{- end }}
