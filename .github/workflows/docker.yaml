name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yaml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yaml'
  workflow_dispatch:
    inputs:
      cube_version:
        description: Override CUBE_VERSION build arg (e.g. v1.6.41)
        required: false

permissions:
  contents: read
  packages: write
  id-token: write          # for OIDC keyless cosign signing
  security-events: write   # for upload-sarif (Trivy results into the Security tab)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cube

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: detect Cube version
        id: cubever
        run: |
          if [ -n "${{ inputs.cube_version }}" ]; then
            echo "version=${{ inputs.cube_version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -E '^appVersion' charts/cube-stack/Chart.yaml | awk '{print $2}' | tr -d '"')
            echo "version=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.cubever.outputs.version }}
            type=sha,format=short

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUBE_VERSION=${{ steps.cubever.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # PR-S1: Trivy now FAILS the build on CRITICAL or HIGH findings.
      # Vetted exemptions go into `.trivyignore` (see file header for the
      # acceptance criteria). SARIF upload runs even on failure so the
      # findings still surface in the Security tab.
      - name: scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: upload Trivy SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
