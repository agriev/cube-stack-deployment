name: docs

# PR-T1: helm-docs autogen guard. The values reference table inside each
# chart's README.md is rendered from values.yaml comments via helm-docs.
# This workflow re-runs helm-docs on every PR that touches values.yaml or
# the Chart.yaml; if the committed README is out of sync it fails the
# job. Contributors regenerate locally via `make docs` before pushing.

on:
  push:
    branches: [main]
    paths:
      - 'charts/**/values.yaml'
      - 'charts/**/Chart.yaml'
      - 'charts/**/README.md'
      - 'charts/**/README.md.gotmpl'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'charts/**/values.yaml'
      - 'charts/**/Chart.yaml'
      - 'charts/**/README.md'
      - 'charts/**/README.md.gotmpl'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: install helm-docs
        run: |
          curl -sL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/helm-docs /usr/local/bin/helm-docs

      # helm-docs gates only the chart READMEs that opt in via a
      # `README.md.gotmpl` template — without one, helm-docs would
      # replace the hand-written README wholesale and a workflow-blocking
      # diff would always fire. The two production charts ship a
      # hand-written README until a .gotmpl is added; this run is
      # informational until then.
      - name: run helm-docs
        run: helm-docs --chart-search-root charts

      - name: assert no diff (only for charts with README.md.gotmpl)
        run: |
          set -euo pipefail
          for chart in charts/cube-stack charts/cube-stack-ha; do
            if [ -f "$chart/README.md.gotmpl" ]; then
              if ! git diff --exit-code -- "$chart/README.md"; then
                echo "::error::helm-docs produced a diff for $chart. Run \`make docs\` locally and commit." >&2
                git diff -- "$chart/README.md" | head -100 >&2
                exit 1
              fi
            else
              echo "Skipping diff check for $chart (no README.md.gotmpl)"
            fi
          done
          # If neither chart had a .gotmpl, reset any helm-docs-emitted
          # noise so the run shows a clean exit.
          git checkout -- charts/ 2>/dev/null || true
