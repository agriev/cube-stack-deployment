name: restore-test

# PR-O3: prove the backup CronJob actually writes a usable tarball end-to-
# end on a kind cluster. Runs the documented restore procedure on a fresh
# cluster and confirms the metastore reads back. Triggered on push to main
# and on every release tag — gives `docs/RESTORE.md` a continuously
# verified "Last verified" cell.

on:
  push:
    branches: [main]
    paths:
      - 'charts/cube-stack-common/templates/_backup-cronjob.tpl'
      - 'charts/cube-stack/templates/cubestore/backup-*.yaml'
      - 'charts/cube-stack-ha/templates/cubestore/backup-*.yaml'
      - 'docs/RESTORE.md'
      - '.github/workflows/restore-test.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vanilla:
    name: backup + restore (cube-stack vanilla, MinIO target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install kind + helm + mc
        run: |
          set -euo pipefail
          # /usr/local/bin requires sudo on GitHub-hosted runners.
          # kind
          curl -sLo /tmp/kind \
            https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          # helm 3.16
          curl -sL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | \
            tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          # MinIO client (for verifying tarball)
          curl -sLo /tmp/mc \
            https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mc /usr/local/bin/mc

      - name: create kind cluster
        run: kind create cluster --wait 60s

      - name: deploy in-cluster MinIO (direct manifest)
        run: |
          set -euo pipefail
          # Inline manifest avoids the bitnami/minio chart, whose
          # registry was moved to Bitnami Premium in 2025 and now
          # ImagePullBackOff's on public DockerHub. We use the
          # upstream minio/minio image directly with a single
          # replica + ephemeral storage — adequate for the smoke
          # test that only writes one tarball.
          kubectl create namespace minio
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector: { matchLabels: { app: minio } }
            template:
              metadata: { labels: { app: minio } }
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
                    args:
                      - server
                      - /data
                      - --console-address
                      - ":9001"
                    env:
                      - { name: MINIO_ROOT_USER,     value: admin }
                      - { name: MINIO_ROOT_PASSWORD, value: changeme }
                    ports:
                      - { containerPort: 9000, name: api }
                      - { containerPort: 9001, name: console }
                    resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits:   { cpu: 500m, memory: 512Mi }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: minio, namespace: minio }
          spec:
            selector: { app: minio }
            ports:
              - { name: api,     port: 9000, targetPort: 9000 }
              - { name: console, port: 9001, targetPort: 9001 }
          EOF
          kubectl -n minio rollout status deploy/minio --timeout 5m

      - name: create MinIO bucket
        run: |
          set -euo pipefail
          # `kubectl run --image=mc -- args` overrides args, NOT
          # entrypoint — and the mc image's entrypoint is `mc`, so
          # `mc sh -c '…'` doesn't parse. Use a Pod manifest with an
          # explicit `command:` override instead. ttlSecondsAfterFinished
          # cleans the Pod up automatically.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: mc-bucket
            namespace: minio
          spec:
            ttlSecondsAfterFinished: 60
            backoffLimit: 2
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: mc
                    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
                    command: [ /bin/sh, -c ]
                    args:
                      - |
                        set -euo pipefail
                        mc alias set local http://minio.minio.svc.cluster.local:9000 admin changeme
                        mc mb --ignore-existing local/cube-backups
                        mc ls local/
          EOF
          kubectl -n minio wait --for=condition=complete --timeout=2m job/mc-bucket
          kubectl -n minio logs job/mc-bucket --tail 20

      - name: deploy cube-stack with backup enabled (quickstart schema, MinIO target)
        run: |
          set -euo pipefail
          kubectl create namespace cube
          kubectl -n cube create secret generic cube-minio-creds \
            --from-literal=access-key-id=admin \
            --from-literal=secret-access-key=changeme

          helm dependency update charts/cube-stack-common
          helm dependency update charts/cube-stack

          helm -n cube install cube charts/cube-stack \
            -f charts/cube-stack/values.yaml \
            -f charts/cube-stack/values-quickstart.yaml \
            --set cubestore.backup.enabled=true \
            --set cubestore.backup.destination='s3://cube-backups/cube-stack' \
            --set cubestore.backup.schedule='*/5 * * * *' \
            --set cubestore.remoteStorage.type=minio \
            --set cubestore.remoteStorage.minio.bucket=cube-backups \
            --set cubestore.remoteStorage.minio.endpoint='http://minio.minio.svc.cluster.local:9000' \
            --set cubestore.remoteStorage.minio.region=us-east-1 \
            --set cubestore.remoteStorage.minio.existingSecret=cube-minio-creds \
            --set cubestore.remoteStorage.minio.accessKeyKey=access-key-id \
            --set cubestore.remoteStorage.minio.secretKeyKey=secret-access-key \
            --wait --timeout 8m

      - name: trigger one-shot backup job
        run: |
          set -euo pipefail
          CJ=$(kubectl -n cube get cronjob \
            -l app.kubernetes.io/component=cubestore-backup \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$CJ" ]; then
            echo "::error::no cronjob with label component=cubestore-backup found" >&2
            kubectl -n cube get cronjob,deploy,sts >&2
            exit 1
          fi
          echo "found cronjob: $CJ"
          kubectl -n cube create job --from=cronjob/$CJ backup-test-1

          # Wait until a pod is scheduled, then stream its logs so we
          # see what's happening in real time. `kubectl logs -f` blocks
          # until the container exits, which is exactly the wait
          # condition we want — no separate polling loop needed.
          for i in $(seq 1 30); do
            POD=$(kubectl -n cube get pods -l job-name=backup-test-1 \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] && break
            sleep 2
          done
          if [ -z "$POD" ]; then
            echo "::error::no pod created for backup-test-1" >&2
            kubectl -n cube describe job backup-test-1 >&2
            exit 1
          fi
          echo "found pod: $POD"

          # Wait for ContainerCreating → Running, then stream logs.
          kubectl -n cube wait --for=condition=Ready pod/$POD --timeout=2m || true
          echo "--- streaming backup pod logs ---"
          kubectl -n cube logs -f $POD || true
          echo "--- end of pod logs ---"

          # Wait for the Job controller to flip the status to Complete
          # or Failed. K8s 1.31+ emits both `SuccessCriteriaMet` and
          # `Complete` as True conditions on a successful Job, so the
          # type list is space-separated; substring match handles
          # both legacy ("Complete") and modern ("SuccessCriteriaMet
          # Complete") shapes.
          end=$((SECONDS + 60))
          phase=""
          while [ $SECONDS -lt $end ]; do
            phase=$(kubectl -n cube get job backup-test-1 \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
            if echo "$phase" | grep -qw 'Complete\|Failed'; then
              echo "job phase: $phase"
              break
            fi
            sleep 2
          done
          if ! echo "$phase" | grep -qw 'Complete'; then
            echo "::error::backup job did not Complete (phase=$phase)"
            exit 1
          fi

      - name: verify tarball appears in MinIO
        run: |
          set -euo pipefail
          # mc as a Job in-cluster — same pattern as bucket creation,
          # avoids port-forward race conditions.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: mc-verify
            namespace: minio
          spec:
            ttlSecondsAfterFinished: 60
            backoffLimit: 1
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: mc
                    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
                    command: [ /bin/sh, -c ]
                    args:
                      - |
                        set -euo pipefail
                        mc alias set local http://minio.minio.svc.cluster.local:9000 admin changeme
                        echo "--- contents of cube-backups bucket ---"
                        mc ls --recursive local/cube-backups/
                        count=$(mc ls --recursive local/cube-backups/ | grep -c 'tar.gz' || true)
                        echo "tar.gz objects: $count"
                        [ "$count" -ge 1 ]
          EOF
          # Stream pod logs (same pattern as backup-test). kubectl wait
          # against multi-condition Job status doesn't always match
          # cleanly on k8s 1.31+; logs -f is simpler.
          for i in $(seq 1 30); do
            POD=$(kubectl -n minio get pods -l job-name=mc-verify \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] && break
            sleep 2
          done
          kubectl -n minio wait --for=condition=Ready pod/$POD --timeout=2m || true
          kubectl -n minio logs -f $POD || true
          # Substring-match Complete in Job conditions
          end=$((SECONDS + 30))
          phase=""
          while [ $SECONDS -lt $end ]; do
            phase=$(kubectl -n minio get job mc-verify \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
            if echo "$phase" | grep -qw 'Complete\|Failed'; then break; fi
            sleep 2
          done
          echo "mc-verify phase: $phase"
          echo "$phase" | grep -qw 'Complete' || exit 1

      # NOTE: the full uninstall + recreate-PVC + untar + reinstall
      # restore loop is documented in docs/RESTORE.md but exceeds the
      # smoke test budget here. A follow-up adds it as a separate
      # `restore` job in this workflow.

      - name: dump cluster state on failure
        if: failure()
        run: |
          kubectl -n cube get pods,pvc,cronjob,job -o wide
          kubectl -n minio get pods -o wide
          kubectl -n cube describe pods | tail -100
