name: release

on:
  push:
    tags:
      - 'cube-stack-v*'         # e.g. cube-stack-v1.1.0   → vanilla chart
      - 'cube-stack-ha-v*'      # e.g. cube-stack-ha-v1.0.0 → HA chart
      - 'chart-v*'              # legacy alias for cube-stack (back-compat)

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-chart:
    name: package + push helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: parse tag → chart name + version
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # tag forms accepted:
          #   cube-stack-ha-vX.Y.Z   → chart=cube-stack-ha, ver=X.Y.Z
          #   cube-stack-vX.Y.Z      → chart=cube-stack, ver=X.Y.Z
          #   chart-vX.Y.Z           → chart=cube-stack, ver=X.Y.Z (legacy)
          if [[ "$tag" == cube-stack-ha-v* ]]; then
            echo "chart=cube-stack-ha" >> "$GITHUB_OUTPUT"
            echo "version=${tag#cube-stack-ha-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == cube-stack-v* ]]; then
            echo "chart=cube-stack" >> "$GITHUB_OUTPUT"
            echo "version=${tag#cube-stack-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == chart-v* ]]; then
            echo "chart=cube-stack" >> "$GITHUB_OUTPUT"
            echo "version=${tag#chart-v}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag $tag does not match any known release pattern"
            exit 1
          fi

      - name: ensure Chart.yaml matches tag
        run: |
          chart_ver=$(grep -E '^version:' charts/${{ steps.tag.outputs.chart }}/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "$chart_ver" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::charts/${{ steps.tag.outputs.chart }}/Chart.yaml version ($chart_ver) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: helm dependency update
        run: helm dependency update charts/${{ steps.tag.outputs.chart }}

      - name: package chart
        run: |
          mkdir -p _packages
          helm package charts/${{ steps.tag.outputs.chart }} --destination _packages

      - name: log in to GHCR (OCI registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: push chart to OCI
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for pkg in _packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${owner}/charts"
          done

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      # `helm registry login` only registers credentials with helm; cosign
      # reads from Docker's credential store. Without docker login, the
      # cosign sign step fails with "UNAUTHORIZED" pushing the signature
      # blob to ghcr.io.
      - name: log in to GHCR for cosign
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: sign chart (OCI keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # cosign-installer doesn't ship `crane`, so we let cosign resolve
          # the tag→digest itself. Signing by tag attaches the signature
          # to the underlying digest, which is what `cosign verify` reads
          # in the post-publish job.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/charts/${{ steps.tag.outputs.chart }}:${{ steps.tag.outputs.version }}"
          cosign sign --yes "$ref"

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: _packages/*.tgz

  verify-chart:
    name: cosign verify (post-publish)
    needs: release-chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: parse tag → chart name + version
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == cube-stack-ha-v* ]]; then
            echo "chart=cube-stack-ha" >> "$GITHUB_OUTPUT"
            echo "version=${tag#cube-stack-ha-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == cube-stack-v* ]]; then
            echo "chart=cube-stack" >> "$GITHUB_OUTPUT"
            echo "version=${tag#cube-stack-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == chart-v* ]]; then
            echo "chart=cube-stack" >> "$GITHUB_OUTPUT"
            echo "version=${tag#chart-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: cosign verify (with retry for ghcr propagation)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/charts/${{ steps.tag.outputs.chart }}:${{ steps.tag.outputs.version }}"
          identity_regex="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@.*"
          # Retry up to 30s; ghcr OCI manifest sometimes takes a moment
          # to propagate after `helm push`.
          for i in $(seq 1 6); do
            if cosign verify \
                --certificate-identity-regexp="$identity_regex" \
                --certificate-oidc-issuer-regexp='https://token\.actions\.githubusercontent\.com' \
                "$ref" >/dev/null 2>&1; then
              echo "✓ cosign verify passed for $ref"
              exit 0
            fi
            echo "attempt $i/6: not yet; sleeping 5s"
            sleep 5
          done
          echo "::error::cosign verify failed for $ref after 30s"
          cosign verify \
            --certificate-identity-regexp="$identity_regex" \
            --certificate-oidc-issuer-regexp='https://token\.actions\.githubusercontent\.com' \
            "$ref"
          exit 1
